skill:
  id: architecture-design
  name: Architektur und Systementwurf
  version: 1.0.0
  owner_module: planning-context
  description: Architektur und Systementwurf als begrenzter Workflow-Blueprint.
  topics:
  - development
  capabilities:
  - architecture_design
  triggers:
  - architektur
  - systementwurf
  - architecture
  - system design
  tool_hints:
  - filesystem
  - git
  workflow:
  - stage: observe
    tool: filesystem
    operation: list_dir
    binding:
      path: <project-root>
    read_only: true
  - stage: plan
    action: map_components_and_contracts
    execution: planning_only
    read_only: true
  - stage: plan
    action: compare_design_options
    execution: planning_only
    read_only: true
  - stage: plan
    action: record_architecture_decision
    execution: planning_only
    read_only: true
  inputs:
  - project-root
  - constraints
  outputs:
  - component map
  - decision record
  execution_support: blueprint_only; parameter_binder_pending
  acceptance_criteria:
  - Inputs and scope are explicit
  - Claims distinguish evidence from assumptions
  - No action outside selected tools and Guard
  boundaries:
  - No automatic deployment, publishing or hardware writes
  - Planning actions require a later validated execution binding
  permissions:
    read:
    - mission
    - registry
    write:
    - plan
  guard:
    level: standard
  compatibility:
    core_contract: 1
    min_guppi_version: 1.11.0
  status: enabled
