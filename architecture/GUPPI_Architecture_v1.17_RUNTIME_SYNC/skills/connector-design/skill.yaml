skill:
  id: connector-design
  name: Schnittstellen und Connector-Entwurf
  version: 1.0.0
  owner_module: planning-context
  description: Schnittstellen und Connector-Entwurf als begrenzter Workflow-Blueprint.
  topics:
  - integrations
  capabilities:
  - connector_design
  triggers:
  - schnittstelle
  - connector
  - api integration
  - mcp integration
  - schnittstellenvertrag
  tool_hints:
  - filesystem
  workflow:
  - stage: observe
    tool: filesystem
    operation: list_dir
    binding:
      path: <project-root>
    read_only: true
  - stage: plan
    action: define_connector_schema_and_permissions
    execution: planning_only
    read_only: true
  - stage: plan
    action: plan_mock_contract_tests_without_credentials
    execution: planning_only
    read_only: true
  - stage: plan
    action: identify_missing_provider_and_write_gates
    execution: planning_only
    read_only: true
  inputs:
  - provider spec
  - allowed operations
  outputs:
  - connector contract
  - test plan
  execution_support: blueprint_only; parameter_binder_pending
  acceptance_criteria:
  - Inputs and scope are explicit
  - Claims distinguish evidence from assumptions
  - No action outside selected tools and Guard
  boundaries:
  - No automatic deployment, publishing or hardware writes
  - Planning actions require a later validated execution binding
  permissions:
    read:
    - mission
    - registry
    write:
    - plan
  guard:
    level: standard
  compatibility:
    core_contract: 1
    min_guppi_version: 1.11.0
  status: enabled
