tool:
  id: filesystem
  name: Secure Filesystem
  version: 0.2.0
  provider: local
  capabilities:
  - read_text
  - list_dir
  - stat
  - sha256
  - mkdir
  - write_text
  - copy
  - move
  - delete
  guard:
    action_class: filesystem
    protected: true
  permissions:
    required: []
  compatibility:
    core_contract: 1
    min_guppi_version: 1.3.0
  health:
    check: tool_health
  status: enabled
