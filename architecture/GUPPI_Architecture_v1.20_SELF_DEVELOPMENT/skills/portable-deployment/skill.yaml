skill:
  id: portable-deployment
  name: USB und Offline-Bereitstellung
  version: 1.0.0
  owner_module: planning-context
  description: USB und Offline-Bereitstellung als begrenzter Workflow-Blueprint.
  topics:
  - portability
  capabilities:
  - portable_deployment
  triggers:
  - usb
  - offline paket
  - offline package
  - portable
  - portabel
  - all in one
  - all-in-one
  tool_hints:
  - filesystem
  - model-runtime
  - sandbox
  workflow:
  - stage: observe
    tool: filesystem
    operation: list_dir
    binding:
      path: <project-root>
    read_only: true
  - stage: observe
    tool: model-runtime
    operation: status
    read_only: true
  - stage: preflight
    tool: sandbox
    operation: doctor
    read_only: true
  - stage: plan
    action: inventory_portable_dependencies_and_licenses
    execution: planning_only
    read_only: true
  - stage: plan
    action: plan_pinned_offline_bundle_and_path_relocation
    execution: planning_only
    read_only: true
  - stage: plan
    action: define_install_restore_and_usb_acceptance
    execution: planning_only
    read_only: true
  inputs:
  - target drive
  - runtime versions
  - dependency lock
  outputs:
  - portable bundle plan
  - dependency gaps
  execution_support: blueprint_only; parameter_binder_pending
  acceptance_criteria:
  - Inputs and scope are explicit
  - Claims distinguish evidence from assumptions
  - No action outside selected tools and Guard
  boundaries:
  - No automatic deployment, publishing or hardware writes
  - Planning actions require a later validated execution binding
  permissions:
    read:
    - mission
    - registry
    write:
    - plan
  guard:
    level: standard
  compatibility:
    core_contract: 1
    min_guppi_version: 1.11.0
  status: enabled
