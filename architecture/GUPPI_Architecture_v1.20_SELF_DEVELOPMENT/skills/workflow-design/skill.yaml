skill:
  id: workflow-design
  name: Prozesse und Automatisierung
  version: 1.0.0
  owner_module: planning-context
  description: Prozesse und Automatisierung als begrenzter Workflow-Blueprint.
  topics:
  - automation
  capabilities:
  - workflow_design
  triggers:
  - automatisierung
  - workflow
  - prozessablauf
  - automation
  - process mapping
  tool_hints:
  - filesystem
  workflow:
  - stage: observe
    tool: filesystem
    operation: list_dir
    binding:
      path: <project-root>
    read_only: true
  - stage: plan
    action: map_trigger_inputs_and_responsibilities
    execution: planning_only
    read_only: true
  - stage: plan
    action: define_human_gates_retries_and_idempotency
    execution: planning_only
    read_only: true
  - stage: plan
    action: draft_workflow_and_acceptance_criteria
    execution: planning_only
    read_only: true
  inputs:
  - process description
  - scope
  outputs:
  - workflow draft
  - gate matrix
  execution_support: blueprint_only; parameter_binder_pending
  acceptance_criteria:
  - Inputs and scope are explicit
  - Claims distinguish evidence from assumptions
  - No action outside selected tools and Guard
  boundaries:
  - No automatic deployment, publishing or hardware writes
  - Planning actions require a later validated execution binding
  permissions:
    read:
    - mission
    - registry
    write:
    - plan
  guard:
    level: standard
  compatibility:
    core_contract: 1
    min_guppi_version: 1.11.0
  status: enabled
