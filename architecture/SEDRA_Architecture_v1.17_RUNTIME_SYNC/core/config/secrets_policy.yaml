secrets_policy:
  schema: 1

  rules:
    - "never_store_plaintext_credentials_in_yaml"
    - "never_write_secrets_to_audit_log"
    - "use_secret_references"
    - "credential_access_requires_guard"
    - "secret_values_are_not_returned_to_modules_unless_required"

  reference_format:
    example: "secret://provider/key-id"
