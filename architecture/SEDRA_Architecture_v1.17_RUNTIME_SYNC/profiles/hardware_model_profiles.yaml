hardware_model_profiles:
  schema: 1
  presets:
    safe-cpu-default:
      hardware_classes:
      - cpu_small
      - cpu_16plus
      - cpu_32plus
      - cpu_64plus
      runtime: llama-cpp-server
      model: Qwen3-4B
      quantization: Q4_K_M
      context:
        recommended: 4096
        maximum: 8192
      kv_cache:
        precision: fp16
        placement: cpu
      batch_size: 128
      microbatch_size: 64
      gpu_layers: 0
      cpu_threads: auto
      parallelism: 1
      memory_reserve_gb: 3
