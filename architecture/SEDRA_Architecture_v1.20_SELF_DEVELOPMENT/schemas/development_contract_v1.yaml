development_contract:
  schema: 1
  required:
    - contract_id
    - objective
    - classification
    - scope
    - allowed_actions
    - forbidden_actions
    - permission_level
    - acceptance_criteria
    - verification_plan
    - rollback_required
    - captain_gate_required
    - contract_digest
  classifications: [E1, E2, E3]
  rules:
    - acceptance_criteria_defined_before_build
    - verification_plan_defined_before_build
    - stable_write_is_not_implicitly_allowed
