# Vorlage des Freigabe-Katalogs der Harness-Shell (SPEC_HARNESS_SHELL_v1 HS-25, G3 Stufe 2, D-E1).
# Gilt, solange es local_config/freigabe_katalog.yaml nicht gibt. Die eigene Datei legt nur der Captain an (D-F2); geändert wird sie nur von ihm.
#
#   werkzeug     datei_lesen, dateien_auflisten, suchen, datei_schreiben, datei_aendern, befehl – oder * für alle
#   muster       Dateien: Glob relativ zur Projektwurzel (** über Ordner, * in einem Teil); befehl: Anfang der Zeile, * am Ende = „beginnt mit“
#   stufe        frei · vorarbeiter (in Stufe 2 wie captain) · captain · verboten
#   begruendung  ein Satz – steht an der Karte, im Audit und als Antwort an das Modell bei „verboten“
# Die genaueste Regel gewinnt (längstes Muster ohne Platzhalter), bei Gleichstand die strengere. Ohne Regel: captain.
# Feste Vorbehalte (harness/vorbehalte.py) schlagen jede Regel hier.
freigabe_katalog:
  version: 1
  regeln:
    - id: lesen-alles
      werkzeug: [datei_lesen, dateien_auflisten, suchen]
      muster: ['**']
      stufe: frei
      begruendung: Lesen im Projekt ändert nichts.
    - id: lesen-geheim
      werkzeug: [datei_lesen, dateien_auflisten, suchen]
      muster: ['**/.env', '**/local_config/**', '**/*.key', '**/*.pem']
      stufe: verboten
      begruendung: Zugangsdaten und Einstellungen des Captains liest das Modell nicht.
    - id: schreiben-geheim
      werkzeug: [datei_schreiben, datei_aendern]
      muster: ['**/.env', '**/local_config/**', '**/*.key', '**/*.pem', '**/.git/**']
      stufe: verboten
      begruendung: Zugangsdaten, Einstellungen des Captains und das Git-Verzeichnis schreibt das Modell nie, auch nicht in einem Schreibbereich mit **.
    # P0 M1 (1.11.2026, Harness-Vergleich 31.10.): im Schreibbereich des Projekts schreibt das Modell ohne Karte – die genaueren Regeln
    # darunter (runtime/**, docs/**) gewinnen, und der Schreibbereich selbst bleibt die harte Grenze. ${schreibbereich} wird je Projekt ersetzt.
    - id: schreiben-schreibbereich
      werkzeug: [datei_schreiben, datei_aendern]
      muster: ['${schreibbereich}']
      stufe: frei
      begruendung: Im Schreibbereich des Projekts darf das Modell arbeiten; was es schreibt, zeigt git diff.
    - id: schreiben-runtime
      werkzeug: [datei_schreiben, datei_aendern]
      muster: ['runtime/**']
      stufe: captain
      begruendung: Code – der Captain sieht den Diff.
    - id: schreiben-docs
      werkzeug: [datei_schreiben, datei_aendern]
      muster: ['docs/**', 'redesign/**']
      stufe: captain
      begruendung: Dokumente und Logbuch – der Captain sieht den Diff.
    - id: befehl-git-lesen
      werkzeug: befehl
      muster: ['git status*', 'git log*', 'git diff*', 'git show*']
      stufe: frei
      begruendung: liest nur.
    - id: befehl-gpu
      werkzeug: befehl
      muster: ['nvidia-smi*']
      stufe: frei
      begruendung: liest nur.
    - id: befehl-tests
      werkzeug: befehl
      muster: ['python benchmarks/run_tests.py *', 'python benchmarks/spec_check.py *']
      stufe: frei
      begruendung: Tests ändern nichts.
    - id: befehl-unittests
      werkzeug: befehl
      muster: ['python -m unittest*', 'python -m pytest*', 'python3 -m unittest*', 'python3 -m pytest*', 'pytest*']
      stufe: frei
      begruendung: Tests ändern nichts (P0 M1).
    - id: befehl-python
      werkzeug: befehl
      muster: ['python *']
      stufe: captain
      begruendung: beliebiger Code – der Captain sieht die Zeile.
    # Stufe 3 (G2 Stufe 3 D-G6): Verantwortung teilen. `vorarbeiter` entscheidet die ernannte Vorarbeiter-Sitzung (ohne sie wirkt es wie `captain`).
    - id: schreiben-spec-entwuerfe
      werkzeug: [datei_schreiben, datei_aendern]
      muster: ['docs/spec_entwuerfe/**']
      stufe: frei
      begruendung: Entwürfe sind nicht verbindlich – das Gate vor dem Bau entscheidet der Captain.
    - id: schreiben-logbuch
      werkzeug: [datei_schreiben, datei_aendern]
      muster: ['docs/LOGBUCH_AGENT_MANAGER.md']
      stufe: vorarbeiter
      begruendung: Logbuchzeilen prüft der Vorarbeiter.
    - id: lauf-tests
      werkzeug: lauf_starten
      muster: ['run_tests', 'spec_check']
      stufe: vorarbeiter
      begruendung: Tests und Stempel ändern nichts.
    - id: lauf-stopp
      werkzeug: lauf_stoppen
      muster: ['*']
      stufe: vorarbeiter
      begruendung: Anhalten eines Laufs ist ungefährlich.
    - id: desktop-aendern
      werkzeug: desktop_aendern
      muster: ['*']
      stufe: captain
      begruendung: "Ändert den Oberflächen-Zuschnitt – der Captain sieht die Diff-Vorschau."
    - id: profil-wechseln
      werkzeug: profil_wechseln
      muster: ['*']
      stufe: captain
      begruendung: "Wendet ein Profil oder eine Vorlage an – der Captain sieht die Diff-Vorschau."
