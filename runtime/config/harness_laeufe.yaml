# Lauf-Typen der Harness-Shell (SPEC_HARNESS_SHELL_v1 HS-20, G2 Stufe 3 §6.1, G3 Stufe 3 N6).
# Ein Lauf ist KEIN freier Befehl: `lauf_starten` nimmt nur eine `id` aus dieser Liste und nur Parameter, die ihr Muster ganz erfüllen.
# Ob ein Lauf starten darf, entscheidet der Freigabe-Katalog (Werkzeug lauf_starten, Muster = Lauf-ID) – hier steht nur, WAS ein Lauf ist.
# Diese Datei ändert nur Claude (harter Vorbehalt); kein Agent und keine Aufgaben-Freigabe schreibt hier.
#
#   argv          Programm und Argumente; ein Element `{name}` wird durch den Parameter ersetzt (nur als ganzes Element). Kein Shell-Interpreter.
#   ordner        Arbeitsordner relativ zur Projektwurzel (ohne ..)
#   parameter     je Name: muster (muss den ganzen Wert treffen), vorgabe (optional), mehrere (Wert wird an Leerzeichen geteilt, jedes Stück prüft das Muster)
#   gpu           keine · slot (nutzt den laufenden Modellserver) · exklusiv (fordert die GPU exklusiv, der Modellserver geht weg)
#   modell_weg    nimmt dem Gespräch das Modell (Vorgabe: gpu == exklusiv)
#   braucht_modell + modell   lädt/nutzt dieses Modell oder diese Rolle; eine Aufgaben-Freigabe muss es in `modelle` nennen (HS-28)
#   fortschritt   art zeilen (regex mit 2 Gruppen: n/m) · prozent (regex mit 1 Gruppe) · text (letzte Zeile)
#   zeitlimit_min wie lange der Lauf höchstens dauern darf
harness_laeufe:
  version: 1
  laeufe:
    - id: run_tests
      name: Tests
      argv: [python, benchmarks/run_tests.py, '{gruppen}']
      ordner: runtime
      parameter:
        gruppen: {muster: '[a-z][a-z0-9_]{0,40}', vorgabe: harness, mehrere: true}
      gpu: keine
      fortschritt: {art: text}
      zeitlimit_min: 90
    - id: spec_check
      name: Spec prüfen (Stempel)
      argv: [python, benchmarks/spec_check.py, '{spec}', --vm, --project, ../workspace/GUPPI_OS]
      ordner: runtime
      parameter:
        spec: {muster: '[a-z][a-z0-9_]{0,60}'}
      gpu: keine
      fortschritt: {art: text}
      zeitlimit_min: 30
    - id: devvm_build
      name: SEDRA-Bau (devvm_build, Profil standard)
      argv: [python, benchmarks/devvm_build.py, ../workspace/GUPPI_OS, --spec, '{spec}', --profile, standard]
      ordner: runtime
      parameter:
        spec: {muster: '[a-z][a-z0-9_]{0,60}'}
      gpu: exklusiv
      modell_weg: true
      braucht_modell: true
      modell: coder.local_primary
      fortschritt: {art: text}
      zeitlimit_min: 120
    - id: harness_abnahme
      name: Abnahme der Harness mit echtem Modell
      argv: [python, benchmarks/harness_abnahme.py, --url, '{url}']
      ordner: runtime
      parameter:
        url: {muster: 'http://127\.0\.0\.1:[0-9]{2,5}/#[A-Za-z0-9_-]{16,128}'}
      gpu: slot
      braucht_modell: true
      modell: coder.local_primary
      fortschritt: {art: text}
      zeitlimit_min: 60
    - id: nachtlauf_3d
      name: Nachtlauf 3D (Stunden, exklusiv)
      argv: [python, benchmarks/nachtlauf_3d.py, --go, --stunden, '{stunden}']
      ordner: runtime
      parameter:
        stunden: {muster: '[1-9]|1[0-2]', vorgabe: '6'}
      gpu: exklusiv
      modell_weg: true
      braucht_modell: true
      modell: coder.llama_qwen35
      fortschritt: {art: text}
      zeitlimit_min: 600
