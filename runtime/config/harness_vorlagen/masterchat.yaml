harness_vorlage:
  version: 1
  id: masterchat
  name: MasterChat
  beschreibung: Zur Anpassung und Einrichtung von SEDRA aus dem Chat – neue Funktionen von Wunsch bis Nachweis. Braucht weitreichende Freigaben, die der Captain beim Anlegen bestätigt.
  hinweis: >-
    Der MasterChat dient zur Anpassung und Einrichtung von SEDRA und braucht dafür weitreichende Befugnisse. Mit deinem Ja darf er in dieser Sitzung, ohne bei jedem
    Schritt zu fragen, Dateien in runtime/src, runtime/tests, docs und redesign schreiben und ändern, die Tests und die Spec-Prüfung starten sowie Python- und
    JavaScript-Dateien auf Syntax prüfen. Es gilt nur für diese Sitzung und lässt sich unter Einstellungen → Agent → Freigabe-Modus jederzeit zurücknehmen.
    Der Kern (Guard, Missionen, Inhaltsschutz), der Freigabe-Code der Harness, die Vorlagen, local_config, Netz und Installieren, Löschen und Git-Push bleiben immer bei dir.
  system: masterchat.md
  werkzeuge: [datei_lesen, dateien_auflisten, suchen, datei_schreiben, datei_aendern, befehl, lauf_starten, lauf_status, app_oeffnen, projekt_beantragen, erinnern, sitzungen_auflisten, sitzungen_aufraeumen, youtube_transkript,
              get_model_status, list_models, get_routing_profile, get_switches, list_projects, list_missions, recent_audit, list_docs, read_doc, list_decisions, arbeitsplatz_stand]
  erlaubnisse:
    - {werkzeug: datei_schreiben, muster: 'runtime/src/**'}
    - {werkzeug: datei_aendern, muster: 'runtime/src/**'}
    - {werkzeug: datei_schreiben, muster: 'runtime/tests/**'}
    - {werkzeug: datei_aendern, muster: 'runtime/tests/**'}
    - {werkzeug: datei_schreiben, muster: 'docs/**'}
    - {werkzeug: datei_aendern, muster: 'docs/**'}
    - {werkzeug: datei_schreiben, muster: 'redesign/**'}
    - {werkzeug: datei_aendern, muster: 'redesign/**'}
    - {werkzeug: befehl, muster: 'python -m py_compile*'}
    - {werkzeug: befehl, muster: 'node --check*'}
    - {werkzeug: lauf_starten, muster: 'run_tests'}
    - {werkzeug: lauf_starten, muster: 'spec_check'}
  rechte: {}
  modell: verifier.llama_gemma
  max_zuege: 40
