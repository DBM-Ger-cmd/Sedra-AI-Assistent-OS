hardware_model_profiles:
  schema: 2
  strategy: qwen3.5_plus_kev_local_first
  presets:
    safe-cpu-default:
      hardware_classes: [cpu_small]
      runtime: llama-cpp-server
      model: Qwen3.5-0.8B
      quantization: Q4_K_M
      verification:
        provider: kev
        model: Kev-0.8B
        base_model: Qwen3.5-0.8B-Base
        execution_mode: SWAP_MODE
      context: {recommended: 4096, maximum: 8192}
      kv_cache: {precision: q8_0, placement: cpu}
      batch_size: 128
      microbatch_size: 64
      gpu_layers: 0
      cpu_threads: auto
      parallelism: 1
      memory_reserve_gb: 3
