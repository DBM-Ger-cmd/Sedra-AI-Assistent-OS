# Selbstabbild: SEDRA beschreibt seine eigenen Abläufe als Prozessmodelle (Plan docs/PLAN_PROZESS_APPS_UIX.md, Phase 5).
# Reine Darstellung, nie ausführbar. Jeder Schritt nennt seine Quelle (datei + suche): `suche` muss wörtlich in der Datei stehen,
# sonst meldet der Abweichungstest (workflows/selbstabbild.py: pruefen) den Schritt als veraltet. Pfade sind relativ zum Projektwurzelordner.
# Schrittarten: start, task, decision, end. Arbeitsweise: manual (Mensch), assisted, automatable.
# `weiter`: Liste der Folgeschritte. Bei einer Entscheidung ist der erste Eintrag der Ja-Weg, der zweite der Nein-Weg.
schema: 1
ablaeufe:
  - id: auftrag-antwort
    name: Auftrag zur Antwort
    zweck: Wie ein Auftrag des Captains in der Harness zu einer Antwort wird.
    schritte:
      - {abschluss: Nachricht angenommen, arbeitsweise: manual, art: start, eingabe: Auftrag im Chat, empfaenger: Harness, ergebnis: Nachricht an die Sitzung, id: eingabe, lieferant: Captain, nachweis: Chat-Eintrag, name: Auftrag eingeben, quelle: {datei: runtime/src/guppi_runtime/harness/schleife.py, suche: def laufen(}, rolle: Captain, weiter: [prompt]}
      - {abschluss: Prompt gebaut, arbeitsweise: automatable, art: task, eingabe: 'Vorlage, Werkzeugliste, gelernte Regeln', empfaenger: Modell, ergebnis: Systemprompt, id: prompt, lieferant: Vorlage und Projekt, nachweis: Sitzungsverlauf, name: Systemprompt zusammenstellen, quelle: {datei: runtime/src/guppi_runtime/harness/schleife.py, suche: def system_prompt(}, rolle: Harness, weiter: [zug]}
      - {abschluss: Zug beendet, arbeitsweise: automatable, art: task, eingabe: Nachrichten, empfaenger: Werkzeugschleife, ergebnis: Text oder Werkzeugaufruf, id: zug, lieferant: Harness, nachweis: Antwort im Strom, name: Modell antwortet im Zug, quelle: {datei: runtime/src/guppi_runtime/harness/schleife.py, suche: def laufen(}, rolle: Modell, weiter: [werkzeug]}
      - {abschluss: Weg gewählt, arbeitsweise: automatable, art: decision, eingabe: Antwort des Zuges, empfaenger: Freigabeprüfung oder Captain, ergebnis: Werkzeugaufruf oder Endantwort, id: werkzeug, lieferant: Modell, nachweis: Werkzeugaufruf im Verlauf, name: 'Werkzeug verlangt?', quelle: {datei: runtime/src/guppi_runtime/harness/schleife.py, suche: def ende_aus(}, rolle: Harness, weiter: [freigabe-pruefen, antwort]}
      - {abschluss: Aufruf erlaubt oder abgewiesen, arbeitsweise: automatable, art: task, eingabe: Werkzeugname und Argumente, empfaenger: Guard, ergebnis: Einstufung, id: freigabe-pruefen, lieferant: Werkzeugschleife, nachweis: Audit-Eintrag, name: Aufruf einstufen (Freigabe), quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: def einstufung(}, rolle: Freigabe, weiter: [zug]}
      - {abschluss: Antwort sichtbar, arbeitsweise: automatable, art: end, eingabe: Endantwort, empfaenger: Captain, ergebnis: Antwort im Chat, id: antwort, lieferant: Modell, nachweis: Chat-Eintrag, name: Antwort anzeigen, quelle: {datei: runtime/src/guppi_runtime/harness/schleife.py, suche: def laufen(}, rolle: Harness, weiter: []}

  - id: freigabe
    name: Freigabe eines Werkzeugaufrufs
    zweck: Wie ein Aufruf eine Freigabe braucht und der Captain darüber entscheidet. Der Captain entscheidet, die Harness führt nur aus.
    schritte:
      - {abschluss: Prüfung beginnt, arbeitsweise: automatable, art: start, eingabe: Werkzeugaufruf, empfaenger: Vorbehalte und Katalog, ergebnis: Aufruf zur Prüfung, id: aufruf, lieferant: Werkzeugschleife, nachweis: Aufruf im Verlauf, name: Werkzeug soll laufen, quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: def ausfuehren(}, rolle: Harness, weiter: [einstufen]}
      - {abschluss: Stufe festgelegt, arbeitsweise: automatable, art: task, eingabe: 'Werkzeug, Argumente, Plan', empfaenger: Entscheidung, ergebnis: Einstufung, id: einstufen, lieferant: Harness, nachweis: Einstufung im Audit, name: 'Vorbehalt, Katalog und Guard prüfen', quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: def einstufung(}, rolle: Freigabe, weiter: [erlaubt]}
      - {abschluss: Weg gewählt, arbeitsweise: automatable, art: decision, eingabe: Erlaubnisse der Sitzung, empfaenger: Ausführung oder Captain, ergebnis: erlaubt oder Karte nötig, id: erlaubt, lieferant: Einstufung, nachweis: Erlaubnis im Verlauf, name: 'Schon erlaubt?', quelle: {datei: runtime/src/guppi_runtime/harness/erlaubnis.py, suche: def deckt(}, rolle: Freigabe, weiter: [ausfuehren, karte]}
      - {abschluss: Karte beantwortet, arbeitsweise: manual, art: task, eingabe: Karte mit Aufruf und Warnungen, empfaenger: Freigabe, ergebnis: Erlauben oder Ablehnen, id: karte, lieferant: Posteingang, nachweis: Entscheidung im Audit, name: Freigabe-Karte beantworten, quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: def beantworten(}, rolle: Captain, weiter: [ausfuehren]}
      - {abschluss: Aufruf beendet, arbeitsweise: automatable, art: task, eingabe: erlaubter Aufruf, empfaenger: Modell, ergebnis: Werkzeugergebnis, id: ausfuehren, lieferant: Freigabe, nachweis: Ergebnis im Verlauf und Audit, name: Werkzeug ausführen, quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: def ausfuehren(}, rolle: Harness, weiter: [fertig]}
      - {abschluss: Zug geht weiter, arbeitsweise: automatable, art: end, eingabe: Ergebnis, empfaenger: Modell, ergebnis: Ergebnis im Gespräch, id: fertig, lieferant: Ausführung, nachweis: Verlauf, name: Ergebnis an die Sitzung, quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: class Kiste}, rolle: Harness, weiter: []}

  - id: bauablauf
    name: Bauablauf mit Vorarbeiter, Bauagent und Prüfer
    zweck: Wie Entwicklungsarbeit auf drei Rollen verteilt wird. Der Vorarbeiter entscheidet Karten seiner Stufe, der Captain behält die übrigen.
    schritte:
      - {abschluss: Auftrag übergeben, arbeitsweise: manual, art: start, eingabe: Wunsch, empfaenger: Vorarbeiter, ergebnis: Bauauftrag, id: auftrag, lieferant: Captain, nachweis: Auftrag im Chat, name: Bauauftrag formulieren, quelle: {datei: runtime/config/harness_vorlagen/vorarbeiter.yaml, suche: 'id: vorarbeiter'}, rolle: Captain, weiter: [leiten]}
      - {abschluss: Aufgaben verteilt, arbeitsweise: assisted, art: task, eingabe: Bauauftrag, empfaenger: Bauagent, ergebnis: Aufgaben für den Bauagent, id: leiten, lieferant: Captain, nachweis: Aufgabenliste, name: Entwicklung leiten, quelle: {datei: runtime/src/guppi_runtime/harness/vorarbeiter.py, suche: class Vorarbeiter}, rolle: Vorarbeiter, weiter: [bauen]}
      - {abschluss: Änderung liegt vor, arbeitsweise: assisted, art: task, eingabe: Aufgabe, empfaenger: Prüfer, ergebnis: Änderung im Arbeitsbereich, id: bauen, lieferant: Vorarbeiter, nachweis: Änderungen und Testlauf, name: Änderung bauen, quelle: {datei: runtime/config/harness_vorlagen/bauagent.yaml, suche: 'id: bauagent'}, rolle: Bauagent, weiter: [tests]}
      - {abschluss: Lauf beendet; bei geändertem Code gibt der Captain den Lauf per Karte frei, arbeitsweise: assisted, art: task, eingabe: Änderung im Arbeitsbereich, empfaenger: Prüfer, ergebnis: Testergebnis, id: tests, lieferant: Bauagent, nachweis: Lauf run_tests mit Ergebnis, name: Tests laufen lassen, quelle: {datei: runtime/config/harness_laeufe.yaml, suche: 'id: run_tests'}, rolle: Vorarbeiter, weiter: [pruefen]}
      - {abschluss: Befund liegt vor, arbeitsweise: assisted, art: task, eingabe: Änderung, empfaenger: Vorarbeiter, ergebnis: Prüfbefund, id: pruefen, lieferant: Bauagent, nachweis: Prüfbericht, name: Änderung prüfen, quelle: {datei: runtime/config/harness_vorlagen/pruefer.yaml, suche: 'id: pruefer'}, rolle: Prüfer, weiter: [gut]}
      - {abschluss: Weg gewählt, arbeitsweise: assisted, art: decision, eingabe: Prüfbefund, empfaenger: Captain oder Bauagent, ergebnis: übernehmen oder nacharbeiten, id: gut, lieferant: Prüfer, nachweis: Entscheidung im Verlauf, name: 'Befund in Ordnung?', quelle: {datei: runtime/src/guppi_runtime/harness/vorarbeiter.py, suche: class Vorarbeiter}, rolle: Vorarbeiter, weiter: [uebernahme, bauen]}
      - {abschluss: Änderung übernommen oder verworfen, arbeitsweise: manual, art: end, eingabe: geprüfte Änderung, empfaenger: Projekt, ergebnis: übernommene Änderung, id: uebernahme, lieferant: Vorarbeiter, nachweis: Entscheidung des Captains, name: Übernahme durch den Captain, quelle: {datei: runtime/src/guppi_runtime/harness/freigabe.py, suche: def beantworten(}, rolle: Captain, weiter: []}

  - id: lernschleife
    name: Lernschleife aus Lob und Korrektur
    zweck: Wie Lob und Korrekturen des Captains zu gemerkten Antworten und Regeln im Systemprompt werden.
    schritte:
      - {abschluss: Rückmeldung gesendet, arbeitsweise: manual, art: start, eingabe: Rückmeldung im Chat, empfaenger: Belohnungssystem, ergebnis: Lob oder Korrektur, id: urteil, lieferant: Captain, nachweis: Chat-Eintrag, name: Captain lobt oder korrigiert, quelle: {datei: runtime/src/guppi_runtime/harness/belohnung.py, suche: def urteil(}, rolle: Captain, weiter: [erkennen]}
      - {abschluss: Urteil festgestellt, arbeitsweise: automatable, art: task, eingabe: Text des Captains, empfaenger: Vermerk, ergebnis: Urteil, id: erkennen, lieferant: Chat, nachweis: Treffer im Vermerk, name: Lob- oder Korrekturwörter erkennen, quelle: {datei: runtime/src/guppi_runtime/harness/belohnung.py, suche: def erkennen(}, rolle: Belohnungssystem, weiter: [art]}
      - {abschluss: Weg gewählt, arbeitsweise: automatable, art: decision, eingabe: Urteil, empfaenger: Vermerk, ergebnis: Weg, id: art, lieferant: Urteil, nachweis: Vermerk, name: 'Lob oder Korrektur?', quelle: {datei: runtime/src/guppi_runtime/harness/belohnung.py, suche: def korrektur(}, rolle: Belohnungssystem, weiter: [merken, merken]}
      - {abschluss: Vermerkt, arbeitsweise: automatable, art: task, eingabe: 'Frage, Antwort, Urteil', empfaenger: Lessons, ergebnis: Tagesdatei für die Wissensdatenbank, id: merken, lieferant: Urteil, nachweis: Eintrag mit Stern oder Flagge, name: Antwort vermerken, quelle: {datei: runtime/src/guppi_runtime/harness/belohnung.py, suche: def vermerken(}, rolle: Belohnungssystem, weiter: [regeln]}
      - {abschluss: Regeln wirken ab der nächsten Sitzung, arbeitsweise: automatable, art: end, eingabe: gelernte Regeln, empfaenger: Modell, ergebnis: Regeln im nächsten Systemprompt, id: regeln, lieferant: Lessons, nachweis: Systemprompt, name: Gelernte Regeln in den Systemprompt, quelle: {datei: runtime/src/guppi_runtime/harness/schleife.py, suche: def system_prompt(}, rolle: Harness, weiter: []}

  - id: modell-scheduler
    name: Modell laden und Scheduler
    zweck: Wie ein Modell auf die GPU kommt, ohne dass etwas Fremdes darauf liegt.
    schritte:
      - {abschluss: Anfrage gestellt, arbeitsweise: automatable, art: start, eingabe: Modellwunsch, empfaenger: Scheduler, ergebnis: Ladeanfrage, id: wunsch, lieferant: Sitzung, nachweis: Anfrage im Betriebslog, name: Modell wird gebraucht, quelle: {datei: runtime/config/model_scheduler.yaml, suche: Model scheduler}, rolle: Harness, weiter: [pruefen]}
      - {abschluss: Zustand bekannt, arbeitsweise: automatable, art: task, eingabe: Zustand der GPU, empfaenger: Entscheidung, ergebnis: sauber oder belegt, id: pruefen, lieferant: Ladeanfrage, nachweis: Prüfergebnis, name: GPU vor dem Laden prüfen, quelle: {datei: runtime/src/guppi_runtime/models/gpu_preflight.py, suche: class GpuNotClean}, rolle: Scheduler, weiter: [sauber]}
      - {abschluss: Weg gewählt, arbeitsweise: automatable, art: decision, eingabe: Prüfergebnis, empfaenger: Modellserver oder Captain, ergebnis: laden oder abweisen, id: sauber, lieferant: Prüfung, nachweis: Entscheidung im Log, name: 'GPU sauber?', quelle: {datei: runtime/src/guppi_runtime/models/gpu_preflight.py, suche: def is_guppi_server(}, rolle: Scheduler, weiter: [laden, abweisen]}
      - {abschluss: Modell antwortet, arbeitsweise: automatable, art: task, eingabe: Modellprofil, empfaenger: Sitzung, ergebnis: bereites Modell, id: laden, lieferant: Scheduler, nachweis: Server bereit, name: Modell laden, quelle: {datei: runtime/config/model_scheduler.yaml, suche: Model scheduler}, rolle: Modellserver, weiter: [bereit]}
      - {abschluss: Captain informiert, arbeitsweise: automatable, art: end, eingabe: belegte GPU, empfaenger: Captain, ergebnis: Meldung, id: abweisen, lieferant: Prüfung, nachweis: Meldung im Betriebslog, name: Laden abweisen und melden, quelle: {datei: runtime/src/guppi_runtime/models/gpu_preflight.py, suche: class GpuNotClean}, rolle: Scheduler, weiter: []}
      - {abschluss: Sitzung kann antworten, arbeitsweise: automatable, art: end, eingabe: laufender Server, empfaenger: Sitzung, ergebnis: bereit, id: bereit, lieferant: Laden, nachweis: Statusleiste, name: Modell bereit, quelle: {datei: runtime/config/model_scheduler.yaml, suche: Model scheduler}, rolle: Modellserver, weiter: []}

  - id: update
    name: Update einspielen
    zweck: Wie ein geprüftes Update in die Installation kommt, mit Vorschau, Bestätigung, Sicherung und Rückweg.
    schritte:
      - {abschluss: Paket entpackt, arbeitsweise: manual, art: start, eingabe: geprüftes ZIP, empfaenger: Installer, ergebnis: entpacktes Paket, id: paket, lieferant: Entwicklung, nachweis: Prüfsumme, name: Update-Paket bereitstellen, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def manifest_lesen(}, rolle: Captain, weiter: [vorschau]}
      - {abschluss: Vorschau vollständig, arbeitsweise: automatable, art: task, eingabe: Paket und Installation, empfaenger: Captain, ergebnis: 'geänderte Dateien, Rechte, Bestätigungsschlüssel', id: vorschau, lieferant: Paket, nachweis: Vorschau-Ausgabe, name: Vorschau ohne Änderung, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def plan(}, rolle: Updater, weiter: [rechte]}
      - {abschluss: Entscheidung getroffen, arbeitsweise: manual, art: task, eingabe: Vorschau, empfaenger: Updater, ergebnis: Freigabe oder Abbruch, id: rechte, lieferant: Updater, nachweis: Bestätigungsschlüssel, name: Vorschau und Rechte durchsehen, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def rechteaenderungen(}, rolle: Captain, weiter: [sichern]}
      - {abschluss: Sicherung liegt vor, arbeitsweise: automatable, art: task, eingabe: aktueller Stand, empfaenger: Rückweg, ergebnis: Sicherung, id: sichern, lieferant: Installation, nachweis: Sicherungsordner, name: Sicherung anlegen, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def sichern(}, rolle: Updater, weiter: [anwenden]}
      - {abschluss: SEDRA neu starten, arbeitsweise: automatable, art: task, eingabe: bestätigter Plan, empfaenger: Installation, ergebnis: neue Programmdateien, id: anwenden, lieferant: Paket, nachweis: Übernahmebericht, name: Dateien übernehmen, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def anwenden(}, rolle: Updater, weiter: [ok]}
      - {abschluss: Entscheidung getroffen, arbeitsweise: manual, art: decision, eingabe: Start von SEDRA, empfaenger: Updater, ergebnis: behalten oder zurück, id: ok, lieferant: Installation, nachweis: Beobachtung, name: 'Läuft nach Neustart?', quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def zurueck(}, rolle: Captain, weiter: [fertig, zurueck]}
      - {abschluss: Alter Stand wiederhergestellt, arbeitsweise: automatable, art: end, eingabe: letzte Sicherung, empfaenger: Installation, ergebnis: alter Stand, id: zurueck, lieferant: Sicherung, nachweis: Rückbericht, name: Auf die Sicherung zurück, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def zurueck(}, rolle: Updater, weiter: []}
      - {abschluss: Update abgeschlossen, arbeitsweise: manual, art: end, eingabe: laufendes System, empfaenger: Betrieb, ergebnis: neuer Stand, id: fertig, lieferant: Installation, nachweis: Version in der Anzeige, name: Update bleibt, quelle: {datei: runtime/src/guppi_runtime/update_anwenden.py, suche: def anwenden(}, rolle: Captain, weiter: []}
