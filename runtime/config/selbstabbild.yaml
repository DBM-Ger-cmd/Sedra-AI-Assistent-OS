      - {abschluss: Entscheidung getroffen, arbeitsweise: manual, art: task, eingabe: Vorschau, empfaenger: Updater, ergebnis: Freigabe oder Abbruch, id: rechte, lieferant: Updater, nachweis: Bestätigungsschlüssel, name: Vorschau und Rechte durchsehen, quelle: {datei: runtime/src/sedra_runtime/update_anwenden.py, suche: def rechteaenderungen(}, rolle: Captain, weiter: [sichern]}
      - {abschluss: Sicherung liegt vor, arbeitsweise: automatable, art: task, eingabe: aktueller Stand, empfaenger: Rückweg, ergebnis: Sicherung, id: sichern, lieferant: Installation, nachweis: Sicherungsordner, name: Sicherung anlegen, quelle: {datei: runtime/src/sedra_runtime/update_anwenden.py, suche: def sichern(}, rolle: Updater, weiter: [anwenden]}
      - {abschluss: SEDRA neu starten, arbeitsweise: automatable, art: task, eingabe: bestätigter Plan, empfaenger: Installation, ergebnis: neue Programmdateien, id: anwenden, lieferant: Paket, nachweis: Übernahmebericht, name: Dateien übernehmen, quelle: {datei: runtime/src/sedra_runtime/update_anwenden.py, suche: def anwenden(}, rolle: Updater, weiter: [ok]}
      - {abschluss: Entscheidung getroffen, arbeitsweise: manual, art: decision, eingabe: Start von SEDRA, empfaenger: Updater, ergebnis: behalten oder zurück, id: ok, lieferant: Installation, nachweis: Beobachtung, name: 'Läuft nach Neustart?', quelle: {datei: runtime/src/sedra_runtime/update_anwenden.py, suche: def zurueck(}, rolle: Captain, weiter: [fertig, zurueck]}
      - {abschluss: Alter Stand wiederhergestellt, arbeitsweise: automatable, art: end, eingabe: letzte Sicherung, empfaenger: Installation, ergebnis: alter Stand, id: zurueck, lieferant: Sicherung, nachweis: Rückbericht, name: Auf die Sicherung zurück, quelle: {datei: runtime/src/sedra_runtime/update_anwenden.py, suche: def zurueck(}, rolle: Updater, weiter: []}
      - {abschluss: Update abgeschlossen, arbeitsweise: manual, art: end, eingabe: laufendes System, empfaenger: Betrieb, ergebnis: neuer Stand, id: fertig, lieferant: Installation, nachweis: Version in der Anzeige, name: Update bleibt, quelle: {datei: runtime/src/sedra_runtime/update_anwenden.py, suche: def anwenden(}, rolle: Captain, weiter: []}

