shell:
  id: cockpit
  name: Cockpit
  description: Ein Werkstück vorn, Nachweise daneben, Gespräch unten (COCKPIT_MODUL_v1).
  version: 1.1.0
  entry:
    js: [dock.js, tree.js, strip.js, palette.js, shell.js]     # shell.js last: it is the one that registers
    css: shell.css
  provides: [strip, tree, dock, talk, palette]
  layout: {persist: browser}
  api:
    - GET /api/strip
    - GET /api/decisions
    - POST /api/decisions/answer
    - GET /api/missions
    - GET /api/models
    - GET /api/library
    - GET /api/agents
    - GET /api/status
    - GET /api/boundaries
    - POST /api/objects
  trust: CORE
  needs: {ui: ">=1.0 <2"}
