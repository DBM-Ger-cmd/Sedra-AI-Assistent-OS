# Arbeitsplatz-Wissen der Harness-Shell (desk/arbeitsplatz.py liest es; Format wie die anderen Shells).
arbeitsplatz:
  satz: Das Gespräch in der Mitte, links die Sitzungen, oben Reiter, unten die Taskleiste.
  zonen:
  - name: Seitenleiste
    wo: 'links: Neue Sitzung, darunter eine Suche und die Knöpfe ☑ (mehrere Sitzungen auswählen und auf einmal nach geloescht/ verschieben, mit Schnellauswahl für gleiche Titel, Ältere und fast Leere) und ⋯ (Sortierung, Älteres einklappen ab 3/7/14/30 Tagen oder nie), Projekte mit ihren Sitzungen, Chats, Einstellungen; Strg+B blendet sie ein und aus'
  - name: Posteingang
    wo: 'links unten in der Seitenleiste, über Aufgaben: der Knopf zeigt, wie viele Anträge auf den Captain warten (Ordner als Projekt, Katalog, Schalter …) und blinkt bei einem neuen; ein Klick klappt die Liste auf, dort wird direkt freigegeben (mit „Sicher?“) oder abgelehnt, „Genau ansehen“ öffnet die Entscheidungen'
  - name: Verknüpfungen
    wo: 'links über dem Posteingang: eigene Knöpfe, die ein Fenster öffnen (z. B. den Rekorder). Der Captain lässt sie im Chat anlegen (Werkzeug app_oeffnen mit verknuepfung=true, höchstens 12) und nimmt sie mit dem Kreuz wieder weg'
  - name: Reiter
    wo: 'oben: jede offene Sitzung ein Reiter; + öffnet eine neue, die mittlere Maustaste schließt'
  - name: Gespräch
    wo: 'Mitte: Antworten streamen, Denken eingeklappt, Werkzeugzeilen aufklappbar'
  - name: Eingabefeld
    wo: 'unter dem Gespräch: Enter sendet, Umschalt+Enter neue Zeile, Stopp oder Esc bricht ab; + oder @ hängt eine Datei des Projekts an, / zeigt Befehle; ein Klick auf das Schild („… gibt frei“) klappt Optionen zur Gesprächsführung auf (Denken eingrenzen, Gedanken ans Modell zurücksenden, Antwortbudget, Länge des Verlaufs; mehr unter Einstellungen → Agent → Token und Gespräch); der Modell-Knopf öffnet die Modell-Steuerung (Laden, Wechseln, Entladen, passt es?); bei einer neuen Sitzung darunter Projekt und Vorlage, „Ordner öffnen …“ und „Als Vorgabe merken“'
  - name: Vorschau
    wo: 'neben dem Gespräch: die Datei, an der SEDRA gerade arbeitet (Diff, Lauf-Log); Seite wechseln, zuklappen, festhalten (Strg+Umschalt+X)'
  - name: Taskleiste
    wo: 'unten: Start (das Start-Menü), offene Sitzungen, Apps und Läufe, rechts der Statusbereich – Freigaben, Token (eingehend ↑ und erzeugt ↓ der Sitzung; Klick öffnet Token und Gespräch), Modell, GPU mit Temperatur, RAM, Modellserver, Scheduler, Zustand – und die Uhr; ein Klick auf eine Zelle öffnet die App dazu'
  - name: Start-Menü
    wo: 'unten links der Knopf Start, Alt+S oder /start: oben die Suche, dann Zuletzt benutzt und die Gruppen Arbeit · Modelle · Wissen · System (· Prüfung); unten die anderen Oberflächen, Darstellung und Schrift'
  - name: App
    wo: 'eine App aus dem Start-Menü öffnet als Reiter: das Werkzeug in der Fläche, Nachweise rechts über den Knopf Nachweise; höchstens 8 Apps zugleich'
  - name: Einstellungen
    wo: 'ein Reiter: Knopf Einstellungen unten in der Seitenleiste, Start → System → Einstellungen, /einstellungen oder Klick auf die Zelle Zustand; links sechs Gruppen (Allgemein, Agent, Sprache, Integrationen, Lokale Modelle, System), rechts die Fläche'
  begriffe:
    app: 'In der Harness-Shell: ein Ort mit seinem Werkzeug als Reiter – Aufgaben, Werkstatt, Wissen, Logbuch, Hardware … aus dem Start-Menü (Start, Alt+S, /start).'
    start-menü: 'Der Knopf Start unten links: Apps suchen und öffnen, zuletzt benutzte oben, Oberfläche wechseln, Darstellung und Schrift. Alt+S öffnet es auch.'
    hardware: 'Start → Modelle → Hardware, oder Klick auf die GPU- oder RAM-Zelle in der Taskleiste. Die GPU-Zelle zeigt Temperatur (Board-Sensor über LibreHardwareMonitor, sonst nvidia-smi), VRAM belegt/gesamt und den thermischen Zustand.'
    werkstatt: 'Start → Modelle → Werkstatt: Modelle laden, Rezepte, Teststrecke – oder Klick auf die Zelle Modell in der Taskleiste.'
    nachweise: 'Im App-Reiter rechts: die Nachweis-Werkzeuge zum Werkstück, zugeklappt bis zum Klick auf „Nachweise“.'
    oberfläche wechseln: 'Start → Oberflächen: Cockpit, Minimal, Paperclip … – offene Apps gehen mit (Arbeitsstand).'
    einstellungen: 'Reiter Einstellungen (Seitenleiste unten, Start → System, /einstellungen, Zelle Zustand): Allgemein (Darstellung, Benachrichtigungen), Agent (Vorlagen – darunter der MasterChat für Anpassung und Einrichtung von SEDRA, Freigabe-Modus mit Katalog-Editor, Grenzen der Schleife, Token und Gespräch), Sprache, Integrationen (MCP, KI GateWay, Cloud), Lokale Modelle (Bibliothek, Werkstatt, Slots, Laufzeit), System (Schutz, Schalter, Modus und Grenzen, Module, Audit). Alles, was auf den Rechner schreibt, ist ein Antrag mit Gate im Posteingang.'
    katalog-editor: 'Einstellungen → Agent → Freigabe-Modus: die Regeln des Freigabe-Katalogs bearbeiten (ID, Werkzeug, Muster, Stufe, Begründung). Vorlage-Regeln mit verboten sind gesperrt; Lockerungen und weite Muster stehen rot. „Antrag stellen“ legt einen Antrag mit Gate an – geschrieben wird erst nach „Freigeben und anwenden“ im Posteingang, mit Sicherung (.bak-<zeit>). „Zurück zur Vorlage“ entfernt die Datei des Captains, ebenfalls mit Gate.'
    schalter: 'Einstellungen → System → Schalter: die Schalter aus local_switches lesen; „Einschalten/Ausschalten beantragen“ legt den Antrag an (Gate), wirkt erst nach Neustart der Oberfläche.'
    grenzen der schleife: 'Einstellungen → Agent → Grenzen der Schleife: max_zuege je Vorlage (4–40) als Antrag mit Gate; nach der Freigabe liegt eine Kopie der Vorlage in local_config/harness_vorlagen. max_tokens und temperature sind nur Anzeige.'
    benachrichtigung: 'Einstellungen → Allgemein → Benachrichtigungen: Browser-Hinweis „SEDRA: eine Freigabe wartet“, wenn das Fenster nicht vorn ist (Erlaubnis nur nach Klick, nie der Karteninhalt), und das Blinken in der Taskleiste an/aus.'
    sitzung: 'In der Harness-Shell: ein gespeichertes Gespräch, eine Datei je Sitzung unter runtime_data/harness/sitzungen.'
    anhängen: 'Im Eingabefeld + oder @: eine Datei des Projekts wählen (nur Namen, nur was der Katalog lesen lässt); sie steht als @pfad im Text, das Modell liest sie.'
    modell laden: 'Der Modell-Knopf im Eingabefeld: Rezept wählen, Laden oder Wechseln; neben jedem Rezept steht, ob es in den freien Speicher passt und warum nicht. Ohne Modell lädt die Shell beim Senden das Standard-Rezept selbst, wenn der Katalog modell_laden dafür frei stellt.'
    für diese sitzung erlauben: 'Knopf auf der Freigabe-Karte: der Aufruf läuft, und gleichartige Aufrufe (derselbe Ordner, derselbe Befehlsanfang) laufen bis zum Schließen der Sitzung ohne Karte. Nicht bei festen Vorbehalten, Warnkarten oder Modellen. Liste und Zurücknehmen: Einstellungen → Agent → Freigabe-Modus.'
    ordner öffnen: 'Unter der Projektzeile einer neuen Sitzung: einen Ordner als Projekt beantragen (Pfad, Name, Schreibbereich); nach der Freigabe im Posteingang steht er in der Projektwahl – ohne Neustart, ohne Konfig-Datei (Laufzeitdatei runtime_data/harness/projekte.yaml).'
    vorgabe: 'Als Vorgabe merken: dieses Projekt bzw. Rezept ist der Standard neuer Sitzungen.'
    zeitlinie: 'In der Taskleiste zeigt der Knopf einer laufenden Sitzung, was sie tut: denkt, schreibt, Werkzeug …, wartet auf Freigabe, Stopp angefordert – mit Dauer.'
    ungeprüft: 'Grauer Text in der Harness-Shell: der Inhaltsschutz hat ihn noch nicht geprüft.'
    ungesehener code: 'Code-Dateien eines Projekts (.py, .js, Skripte, Konfiguration), die seit der letzten Freigabe geändert wurden – von der Harness, einem Lauf oder von außen. Solange es sie gibt, zeigt jeder Lauf und Befehl der Harness sie zuerst auf einer Karte (mit Diff, wo die vorige Fassung vorliegt); keine Aufgabe und keine Sitzungs-Erlaubnis deckt das. Nach „Erlauben“ gilt die Fassung als gesehen. In der Konsole: guppi code-stand <projekt> --zeigen bzw. --uebernehmen (z. B. nach einem git pull). Schalter code_sicht in local_config/switches.yaml (Standard an).'
