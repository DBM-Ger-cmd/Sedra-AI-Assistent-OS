# Shell D (Paperclip) – eine Firma statt eines Cockpits: Navigation links, Seiten, das Gespräch als Schublade.
shell:
  id: paperclip
  name: "Paperclip"
  description: "Dashboard mit Posteingang, Organigramm und Issues; Navigation links, Agentenfenster rechts, das Gespräch als Schublade (Entwurf D)."
  version: 1.2.0
  entry:
    js: [pages.js, nav.js, topbar.js, windows.js, shell.js]     # shell.js zuletzt: es registriert
    css: shell.css
  provides: [tree, dock, windows, talk, notify, palette, inbox]   # windows: der Stapel der Agentenfenster (Spec 4)
  layout: {persist: browser}
  api:
    - GET /api/strip
    - GET /api/decisions
    - POST /api/decisions/answer
  trust: CORE
  needs: {ui: ">=1.0 <2"}
