# Arbeitsplatz-Wissen dieses Moduls (Build 24, Ticket B6-G-06; Klaus 15.10.2026 19:36: „Arbeitsplatzwissen bleibt immer im Modul“).
# desk/arbeitsplatz.py liest diese Datei ein; SEDRA antwortet daraus im Gespräch – ohne Modell, mit Knöpfen, nichts läuft von allein.
# Erlaubt: satz, zonen [{name, wo}], woerter {wort: {ist, objekt}}, anleitungen [{id, titel, schritte, ort, stich}], begriffe {wort: text}.
arbeitsplatz:
  anleitungen:
  - id: projekt_anlegen
    titel: Ein Projekt anlegen
    schritte:
    - „＋ Neu → Projekt“ (Cockpit) oder Navigation „Dateien“ → „Neues Projekt“ (Paperclip).
    - Einen Namen eingeben (1–80 Zeichen) und „Anlegen“ – der Ordner entsteht unter projects/.
    - Danach „Modus und Grenzen“ bestätigen; ohne sie bleibt jede Aufgabe stehen.
    ort:
      type: project
      id: neu
      title: Neues Projekt
    stich: projekt anlegen neues projekt ordner erstellen anfangen beginnen
