tool:
  id: files
  name: "Projekt"
  description: "Dateien des Projekts; eine Datei öffnet als eigener Reiter."
  version: 1.0.0
  kind: object
  handles: [project, file]
  order: 25
  entry: {js: tool.js, css: tool.css}
