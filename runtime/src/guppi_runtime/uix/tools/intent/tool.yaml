tool:
  id: intent
  name: "Vorhaben"
  description: "Der Satz, um den es geht, seine Stufen – und die Aufgaben, die daraus geworden sind."
  version: 1.0.0
  kind: object
  handles: [intent]
  order: 14
  slot: inhalt
  entry: {js: tool.js, css: tool.css}
  api:
    - POST /api/objects
    - POST /api/actions
    - POST /api/intent/create
    - GET /api/intent/vorlagen     # Vorlagen für Vorhaben mit Stufen (19.10.2026)
  events:
    emits: [object.open]
    listens: [task.changed, tools.refresh]
  trust: CORE
  tests: [test.spec.js]
  needs: {ui: ">=1.0 <2"}
