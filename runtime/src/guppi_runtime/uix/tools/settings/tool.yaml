tool:
  id: settings
  name: "Einstellungen"
  description: "API-Einstellungen für Cloud-Modelle mit API-Schlüssel. Schlüssel werden nie angezeigt."
  version: 1.0.0
  kind: object
  handles: [settings]
  order: 85
  entry: {js: tool.js, css: tool.css}
  api:
    - GET /api/cloud
    - POST /api/cloud/save
    - POST /api/cloud/key
  events:
    emits: [object.open]
    listens: []
  trust: CORE
  needs: {ui: ">=1.0 <2"}
