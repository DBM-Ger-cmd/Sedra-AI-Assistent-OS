tool:
  id: system
  name: "System"
  description: "Maschinenraum und Hardware: Teile, Entwicklungsumgebung, GPU."
  version: 1.0.0
  kind: object
  handles: [machine, hardware]
  order: 80
  entry: {js: tool.js, css: tool.css}
  api:
    - GET /api/status
    - POST /api/update/suche      # Update-Suche auf Klick (nur lesen)
    - POST /api/update/vorschau   # lädt den Tag in den Staging-Ordner, schreibt nichts ins Programm
    - POST /api/update/uebernehmen # nur mit Rechte-Bestätigung aus der Vorschau
    - POST /api/update/zurueck    # stellt die letzte Sicherung wieder her
  events:
    emits: [object.open]
    listens: [system.state, model.changed]
  trust: CORE
  tests: [test.spec.js]
  needs: {ui: ">=1.0 <2"}
