tool:
  id: talk
  name: "Gespräch"
  description: "Das eine Eingabefeld – Antwort, Auftrag, Navigation, „einmal ja“."
  version: 1.3.0
  kind: panel
  handles: []
  order: 10
  entry: {js: [kombi.js, verlauf.js, tool.js], css: tool.css}
  api:
    - POST /api/chat/reply
    - POST /api/chat/kombi
    - GET /api/decisions
    - POST /api/actions          # Build 19: ein Knopf unter SEDRAs Antwort – derselbe Weg wie jeder Werkzeugknopf, Gates darunter
    - POST /api/intent/create    # Build 19: „Als Vorhaben anlegen“ – führt nichts aus; seit 19.10. mit Stufen
    - POST /api/chat             # „Als Auftrag anlegen“ (propose_task): eine Aufgabe, geplant, nicht ausgeführt
    - POST /api/objects          # „lade …“ im Gespräch: die Modelle lesen (read-only); das Laden geht als Verb über /api/actions – vorher rief das Gespräch /api/models und /api/model/load außerhalb des Manifests, 403 (Verbindungsprüfung 19.10.)
    - GET /api/cloud             # Wahl neben Senden: welche Cloud-Modelle bereit sind (nur lesen)
    - POST /api/cloud/models     # ... und ihre Modellliste beim Anbieter (nur lesen)
    - POST /api/chat/cloud       # Gespräch mit einem gewählten Cloud-Modell, durch den Inhaltsschutz
    - GET /api/chat/verlauf      # Vertrag 1.1 (SPEC_DOCK_OHNE_NEUAUFBAU_v1 §9.2): der Verlauf liegt auf dem Server und übersteht Neuladen und Shell-Wechsel
    - POST /api/chat/verlauf/leeren   # „Gespräch leeren“ – Audit ohne Inhalt
  events:
    emits: [object.open, talk.mode]
    listens: [talk.context, decision.pending, decision.answered, live.line, object.open, wissen.auswahl]   # B6-G-03: der offene GateWay-Vorgang
  trust: CORE
  tests: [test.spec.js]
  needs: {ui: ">=1.0 <2"}
