version: '3.8'

services:
  service_name:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: project_name-service_name
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app/src
      - SEDRA_CONFIG_ROOT=/app/configs
    volumes:
      - ../configs:/app/configs:ro
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s