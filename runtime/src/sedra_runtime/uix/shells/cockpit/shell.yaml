shell:
  id: cockpit
  name: Cockpit
  description: Ein Werkstück vorn, Nachweise daneben, Gespräch unten (COCKPIT_MODUL_v1).
  version: 1.2.0
  entry:
    js: [dock.js, tree.js, strip.js, palette.js, rahmen.js, shell.js]     # shell.js last: it is the one that registers
    css: shell.css
  provides: [strip, tree, dock, talk, palette]
  layout: {persist: browser}
  grundfunktionen:   # AM2-14: wie die Shell die sieben Grundfunktionen erreichbar macht – nach provides, im Browser noch nicht geprüft
    entscheidungen: ort
    gespraech: slot:talk
    aufgaben: ort
    logbuch: ort
    modus_grenzen: ort
    module_berechtigungen: ort
    einstellungen_zustand: ort
  api:
    - GET /api/strip
    - GET /api/decisions
    - POST /api/decisions/answer
    - GET /api/missions
    - GET /api/models
    - GET /api/library
    - GET /api/agents
    - GET /api/status
    - GET /api/boundaries
    - POST /api/objects
  trust: CORE
  needs: {ui: ">=1.0 <2"}
