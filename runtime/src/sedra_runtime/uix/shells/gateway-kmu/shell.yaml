shell:
  id: gateway-kmu
  name: "KI Gateway für KMU"
  description: "Das KI Gateway im Design der Präsentation: Kopf mit dem Ablauf, das Werkstück in der Mitte, das Gespräch unten."
  version: 1.0.0
  entry: {js: shell.js, css: shell.css}
  provides: [dock, talk]
  layout: {persist: browser}
  grundfunktionen:   # AM2-14: wie die Shell die sieben Grundfunktionen erreichbar macht – nur das Gespräch; Entscheidungen laufen über die Antwortroute, der Rest folgt mit AM7 (verwaltung)
    gespraech: slot:talk
  api:
    - POST /api/decisions/answer   # Freigabe „Jetzt freigeben“ / „Ablehnen“ – derselbe Weg wie in den anderen Oberflächen
  trust: CAPTAIN
  needs: {ui: ">=1.0 <2"}
