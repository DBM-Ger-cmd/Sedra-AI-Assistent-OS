# Die Harness-Shell (SPEC_HARNESS_SHELL_v1, G2 §6): das Gespräch steht in der Mitte, Antworten streamen, Werkzeugaufrufe sind sichtbar.
# Fünf Zonen (HS-01): Seitenleiste, Reiterleiste, Arbeitsfläche, Eingabefeld, Taskleiste. Stufe 1: Gespräch, Sitzungen; Stufe 2: Werkzeuge mit Freigabe-Karte;
# Stufe 3: Vorarbeiter, Aufgaben, Läufe; Stufe 4: Start-Menü mit Apps (Werkzeuge des Vertrags als Reiter), Oberflächen, Statusbereich – `umschalter: menue` (Vertrag N3).
# Stufe 6: Zweck der Aufgaben, Projekte erklärt, Vorschau neben dem Gespräch (vorschau.js).
# Stufe 5: Einstellungen (HS-42) als Reiter – sechs Gruppen, Werkzeuge eingehängt, Katalog-Editor und Grenzen nur über Antrag mit Gate.
shell:
  id: harness
  name: One Sedra          # Anzeigename seit 05.11.2026 (vorher Harness); die technische Kennung `harness` bleibt: Adressen, /api/harness, Dateien, START_SEDRA harness
  description: Gespräch in der Mitte mit Sitzungen, Streamen und sichtbaren Werkzeugen; Werkzeuge mit Freigabe-Karte; Vorarbeiter, Aufgaben-Freigabe und Läufe; Start-Menü mit Apps, Oberflächen und Statusbereich (Stufe 4); Einstellungen mit Katalog-Editor (Stufe 5).
  version: 1.11.0
  entry:
    js: [markdown.js, projekt.js, vorlagenhinweis.js, gespraechsoptionen.js, seitenleiste.js, seite.js, reiter.js, karte.js, aufgabe.js, lauf.js, zeilen.js, strom.js, verlauf.js, eingabe.js, startliste.js, app.js, translator.js, team.js, uebersicht.js, startmenue.js, katalog_editor_pruefung.js, katalog_editor.js, erlaubnisse.js, oberflaeche.js, tokenseite.js, hilfswerkzeugseite.js, infoseite.js, vorlagenneu.js, desktop.js, vorschlaege.js, bausteine.js, layouteditor.js, builder.js, kontext.js, kontextmodule.js, einstellungen_seiten.js, einstellungen.js, vorschau.js, modell.js, anhang.js, schnell.js, zellen.js, taskleiste.js, shell.js]     # shell.js zuletzt: es registriert
    css: [shell.css, translator.css, team.css, uebersicht.css, einstellungen.css, vorschau.css, startmenue.css, kontext.css]
  provides: [seite, reiter, flaeche, eingabe, taskleiste]
  layout: {persist: browser}
  grundfunktionen:   # AM2-14: wie die Shell die sieben Grundfunktionen erreichbar macht – Posteingang der Seitenleiste, Start-Menü; im Browser geprüft (test_uix_grundfunktionen_browser)
    entscheidungen: eigen
    gespraech: eigen
    aufgaben: eigen
    logbuch: ort
    modus_grenzen: ort
    module_berechtigungen: ort
    einstellungen_zustand: eigen
  umschalter: menue           # Stufe 4 (D-S1): kein Alt+S-Chip, kein Mini-Hub – das Start-Menü der Shell; Alt+S ruft es
  api:
    - GET /api/harness/*
    - POST /api/harness/*
    - PATCH /api/harness/*
    - DELETE /api/harness/*
    - GET /api/strip
    - GET /api/decisions
    - POST /api/decisions/answer
    - GET /api/missions
    - GET /api/models
    - POST /api/model/load       # Stufe 6: Modell direkt im Eingabebereich laden
    - POST /api/model/unload
    - GET /api/uix/modules      # Stufe 4: Apps ohne Ort, Oberflächen
    - GET /api/uix/shelf        # Stufe 4: „zuletzt benutzt“ auf dem Rechner
    - POST /api/uix/shelf
    - GET /api/uix/zugaenge     # AM4-04: Berechtigung der Zugänge mcp und cli (nur lesen)
    - GET /api/uix/clients      # Stufe 5: MCP/CLI-Clients (nie der Token)
    - GET /api/switches         # Stufe 5: Schalter lesen; Änderung als Antrag mit Gate
    - POST /api/switch/request
    - GET /api/sprache/status   # Stufe 5: Quelle (nur Anzeige)
    - GET /api/sprache/kern/stand   # Aufnahme-Knopf der Taskleiste: läuft eine Aufnahme?
    - POST /api/sprache/kern/start  # derselbe Weg wie im Werkzeug Rekorder
    - POST /api/sprache/kern/stopp
    - GET /api/cloud            # Startseite der Einstellungen: Stand der Kachel KI-Labor (nur lesen)
  trust: CORE
  needs: {ui: ">=1.0 <2"}
