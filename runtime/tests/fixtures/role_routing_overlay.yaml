# Test data (2026-10-12): a frozen copy of this PC's recipe file of 2026-10-12 07:47, local folders replaced by placeholders.
# The UIX routing tests used to read the live file, which changes whenever the Captain changes a recipe.
# Machine-specific routing for THIS PC (RTX 4070 Ti 12 GB, 31 GB RAM). Created 2026-10-01 together with the Captain.
# Overlays runtime/config/role_routing.yaml; the shipped file stays generic.
#
# `enabled: true` since 2026-10-01 (the Captain asked for the switches to be turned on). Nothing starts by itself.
#
# TWO WAYS TO RUN EACH MODEL, in this order of preference (the router takes the first one that is usable, and falls back on a
# provider failure):
#   1. provider llama-cpp-server: a llama-server that GUPPI starts and watches itself (llama_server_runtime.py). Every option is
#      explicit; the model file, KV type, MTP and reasoning options are in `profile.server`.
#   2. provider lm-studio: through LM Studio's own server. Its engine crashed under long generations on this PC (CUDA illegal memory
#      access), MTP stays off there (model_loader.yaml), so it is the fallback.
#
# Facts behind the numbers (measured on this PC, not assumed):
#  - Weights ids are the SHA-256 of the exact GGUF files:
#      qwen3.5-9b-mtp           -> unsloth/Qwen3.5-9B-MTP-GGUF/Qwen3.5-9B-UD-Q4_K_XL.gguf              6,135,034,208 bytes
#      google/gemma-4-12b-qat   -> lmstudio-community/gemma-4-12B-it-QAT-GGUF/gemma-4-12B-it-QAT-Q4_0.gguf  6,975,879,008 bytes
#  - llama-server (GUPPI's own start, --no-mmproj, one slot, idle after start, GPU baseline 0.53 GiB subtracted):
#      qwen  MTP off  ctx  8192 5.50  16384 5.67  32768 6.02  65536 6.71 GiB
#      qwen  MTP on   ctx  8192 5.92  16384 6.14  32768 6.53  65536 7.35 GiB      (about twice the speed: 140 vs 69 tokens/s)
#      gemma          ctx  8192 7.41  16384 7.54  32768 7.80  65536 8.33 GiB
#    The recipes carry these plus 0.3 GiB for the compute buffers that grow during generation.
#  - LM Studio path (same models, with its stored KV defaults qwen q8_0 / gemma f16, mmproj loaded):
#      qwen   ctx  8192 7.96  65536 9.39 GiB      gemma  ctx 16384 7.87  65536 8.66 GiB
#  - Contexts are tiers: a job loads the smallest tier that holds what it needs (requirements.context_min_tokens).
#  - Coder and verifier are different families (qwen3.5 vs gemma4), which is what the independence rule needs.
#    They do not fit in VRAM together next to the desktop; they run one after the other (SWAP_MODE).
role_routing:
  enabled: true
  capabilities:
    # 1a. gpt-oss-20b: FIRST CHOICE from 2026-10-02 until 2026-10-03, then id coder.llama_gptoss (Qwen3-Coder took coder.local_primary). It carried the shipped id `coder.local_primary`
    #     because the overlay replaces a shipped recipe in place and the shipped position is what makes it first; a new id would land
    #     behind it. Previous file: role_routing.yaml.bak-2026-10-02-before-gptoss-first. To go back, swap the two ids again.
    # coder side, gpt-oss-20b (OpenAI, MoE with 3.6B active parameters, MXFP4). 12.1 GB of weights: the expert weights of the first
    # n_cpu_moe layers stay in host RAM so that the rest fits next to the desktop. Measured 2026-10-02 with moe_modelltest.py (ctx 65536, KV q8_0,
    # NVIDIA Studio driver 616.92, GPU debug mode = reference clocks): n_cpu_moe 4 -> 11.0 GB, 837 tokens/s prompt, 85 tokens/s generation;
    # n_cpu_moe 3 -> 11.4 GB, 1047 / 94; n_cpu_moe 2 -> 11.5 GB spills out of VRAM (generation drops to 41). Always thinks; it knows low / medium / high,
    # not "none". 4 keeps about 0.4 GB of room for the desktop, so that is the recipe's value.
    - id: coder.llama_gptoss
      version: 5
      roles: [coder, planner, reviewer, tester, documentation, context_curator, tool_operator, researcher]
      provider: llama-cpp-server
      model: gpt-oss-20b
      model_family: gpt-oss
      weights_id: sha256:27cd6c432c7672cb812a92f611cf3ba7bbc35928262bb1e1253ff4ee6ae35901
      location: local
      requirements: {min_ram_gb: 12, min_vram_gb: 0}
      model_size_gb: 11.28
      # n_cpu_moe 5 since 2026-10-03 (Captain: "dauerhaft Luft schaffen"): with 4, the 16k tier missed the 1 GiB reserve by 14-110 MB whenever
      # Steam or a browser held GPU memory. With 5: 8192 9.28 / 16384 9.40 / 32768 9.63 GiB incl. probe (with 4: 9.62 / 9.72 / 9.94);
      # generation 81.5 tokens/s at 16k (with 4: ~85). Backup: role_routing.yaml.bak-2026-10-03-before-n_cpu_moe-5
      # 48k window since 2026-10-03 (Captain: "64k zum coden, 32k akzeptiert wenn besser"; measurements context_ladder_* / context_coding_*):
      #   - KV q8_0 turned to garbage at 48k (needle test, even with 2 GiB free) and at 64k (coding 1 of 4); KV f16 + n_cpu_moe 7: 48k needle
      #     3/3, coding 98 % (9 tasks, ~34k input tokens), 1.61 GiB free while working, ~65 tokens/s generation, ~520 tokens/s prompt.
      #   - 64k is NOT offered: above ~40k INPUT tokens gpt-oss runs away (8000 tokens without an answer) with q8 and with f16 alike.
      #   Backup: role_routing.yaml.bak-2026-10-03-before-context-measurements
      measured_vram_gb: 8.82        # measured 2026-10-03 (recipe_measure)
      measured_context: 8192        # measured 2026-10-03 (recipe_measure)
      kv_cache_gb_per_1k_tokens: 0.024        # measured 2026-10-03 (recipe_measure)
      profile:
        # recommended 8192 since 2026-10-02 (was 16384): with the desktop at ~1.0 GiB, 16384 missed the 1 GiB safety reserve by ~25 MB and the
        # router fell back to qwen3.5. Jobs that need more still ask for a bigger tier via requirements.context_min_tokens.
        context: {recommended: 8192, maximum: 49152, measured_maximum: 49152, tiers: [8192, 16384, 32768, 49152]}
        gpu_layers: 99
        kv_cache: {placement: gpu}
        server: {gguf: '<modelle>\ggml-org\gpt-oss-20b-GGUF\gpt-oss-20b-MXFP4.gguf', kv_cache_type: f16, mtp: false, reasoning: auto, n_cpu_moe: 7, jinja: false}
        # jinja: false (2026-10-02): with the Jinja template the server's Harmony parser rejects a correct `<|constrain|>JSON` answer with
        # HTTP 500 (default and reasoning_format none failed 1-3 of 3; --no-jinja 3 of 3 OK). GUPPI's adapter splits the raw Harmony output.
      permissions: {max_level: 2}
      network: {allowed: false}
      tests: [capability_smoke_test, syntax_test, deterministic_task_test]
      rollback: {supported: true}
      metadata: {source: captain_custom, trust_level: CAPTAIN_CUSTOM}

    # 1b. coder side, qwen3.5 on GUPPI's own llama-server (was first choice as coder.local_primary v3 until 2026-10-02).
    - id: coder.llama_qwen35
      enabled: false   # guppi-model-remove RM-20261003T185920
      version: 1
      roles: [coder, planner, reviewer, tester, documentation, context_curator, tool_operator, researcher]
      provider: llama-cpp-server
      model: qwen3.5-9b-mtp
      model_family: qwen3.5
      weights_id: sha256:362f85a2d7dbc0259e926d5ac33ca0d0f17fd3753496d65bfd2106384c929d3f
      location: local
      requirements: {min_ram_gb: 4, min_vram_gb: 0}
      model_size_gb: 5.71
      measured_vram_gb: 6.2        # MTP on, ctx 8192: 5.92 measured + 0.3 margin
      measured_context: 8192
      kv_cache_gb_per_1k_tokens: 0.026   # measured 0.0249 (MTP on) between 8192 and 65536
      profile:
        # Capped at 16384: qwen3.5 (hybrid) crashed with CUDA illegal memory access at prompts of ~23k tokens and above (7k and 15k stable; all
        # flags, KV types, MTP on/off and versions tried). The working set keeps prompts under this. See docs/PHASE9_STATUS.md.
        context: {recommended: 8192, maximum: 16384, measured_maximum: 16384, tiers: [8192, 16384]}
        gpu_layers: 99
        kv_cache: {placement: gpu}
        # mtp: true uses speculative MTP drafting if llama_server.mtp (local switches / llama_server.yaml) allows it. Set false to turn it off for this model.
        server: {gguf: '<modelle>\unsloth\Qwen3.5-9B-MTP-GGUF\Qwen3.5-9B-UD-Q4_K_XL.gguf', kv_cache_type: q8_0, mtp: true, reasoning: auto}
      permissions: {max_level: 2}
      network: {allowed: false}
      tests: [capability_smoke_test, syntax_test, deterministic_task_test]
      rollback: {supported: true}
      metadata: {source: captain_custom, trust_level: CAPTAIN_CUSTOM}

