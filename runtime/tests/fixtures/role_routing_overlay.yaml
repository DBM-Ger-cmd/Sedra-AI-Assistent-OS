        # (1 of 2 runs, also with engine b11160); with it off 2 of 2 runs stayed clean. Cost about 2 % (CPU-bound MoE).
        server: {gguf: '<modelle>\unsloth\Qwen3-Coder-30B-A3B-Instruct-GGUF\Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf', kv_cache_type: f16, mtp: false, reasoning: auto, n_cpu_moe: 44, ubatch: 2048, mmap: false, flash_attn: 'off'}
